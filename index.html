<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%234F46E5%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%230F9D9A%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2216%22%20fill=%22url%28%23g%29%22/%3E%3Crect%20x=%2214%22%20y=%2214%22%20width=%2236%22%20height=%2236%22%20rx=%229%22%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-width=%223.5%22/%3E%3Cg%20fill=%22%23fff%22%3E%3Ccircle%20cx=%2224%22%20cy=%2224%22%20r=%223.2%22/%3E%3Ccircle%20cx=%2240%22%20cy=%2224%22%20r=%223.2%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%223.2%22/%3E%3Ccircle%20cx=%2224%22%20cy=%2240%22%20r=%223.2%22/%3E%3Ccircle%20cx=%2240%22%20cy=%2240%22%20r=%223.2%22/%3E%3C/g%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Diseño: papel gris rosado del manual con niebla, títulos en capitales de cartucho granate, cubierta pizarra con filete dorado. Todo dibujado con CSS y SVG propios. */
:root{
  --bg:#F0ECEB; --mist:#DDD8D5; --surface:#E8E3E2; --field:#F8F6F5; --ink:#2A2325; --muted:#665154; --line:#B8ADAF;
  --accent:#6A1F24; --accent-ink:#F8F4F3; --head:#6A1F24; --frame:#6A1F24; --plum:#665154; --plum-ink:#FFFFFF;
  --gold:#C59E57; --gold-ink:#7A5A1E; --ok:#3F6B52; --warn:#A4531A;
  --cov-bg:#383D41; --cov-bg2:#2B2F32; --cov-gold:#C59E57; --cov-ink:#D8D6D6;
  --display:'Cinzel',Georgia,'Times New Roman',serif; --serif:'Alegreya',Georgia,'Times New Roman',serif;
  --sc:'Alegreya SC','Alegreya',Georgia,serif; --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mist-a:rgba(255,255,255,.55); --mist-b:#C9C2C0; --mist-c:#B3AAA8; --pink:rgba(168,110,118,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#25292C; --mist:#383D41; --surface:#30353A; --field:#25292C; --ink:#DCD9D8; --muted:#B0A9AA; --line:#50575C;
  --accent:#C59E57; --accent-ink:#1E2225; --head:#DDBF86; --frame:#C59E57; --plum:#5E484E; --plum-ink:#F3EEEE;
  --gold-ink:#E3C48A; --ok:#86C39F; --warn:#EBA06B; --mist-a:rgba(255,255,255,.10); --mist-b:#464C51; --mist-c:#31363A; --pink:rgba(150,80,90,.30); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#25292C; --mist:#383D41; --surface:#30353A; --field:#25292C; --ink:#DCD9D8; --muted:#B0A9AA; --line:#50575C;
  --accent:#C59E57; --accent-ink:#1E2225; --head:#DDBF86; --frame:#C59E57; --plum:#5E484E; --plum-ink:#F3EEEE;
  --gold-ink:#E3C48A; --ok:#86C39F; --warn:#EBA06B; --mist-a:rgba(255,255,255,.10); --mist-b:#464C51; --mist-c:#31363A; --pink:rgba(150,80,90,.30); color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(130% 260px at 50% 0,var(--mist),transparent 75%),radial-gradient(120% 220px at 50% 100%,var(--mist),transparent 75%);
  color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.5;padding-inline:16px;padding-block:0}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1,h2{font-family:var(--display);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button,input,select,textarea,label.f,.chip,.counter,.stat,.kv,table.sk,.tag,.era,.mod,.step,.nav,.toast,.btn,.sheetgrid h4,.item .nm span{font-family:var(--sans)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-block:16px 100px}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.btn{border:1.5px solid var(--frame);background:var(--field);border-radius:6px;padding:10px 16px;min-height:44px;font-weight:600;font-size:.95rem}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
/* cubierta */
.cover{position:relative;background:linear-gradient(180deg,var(--cov-bg),var(--cov-bg2));color:var(--cov-ink);text-align:center;padding:30px 28px 26px;margin-bottom:18px;border-radius:4px;isolation:isolate}
.cover::before{content:"";position:absolute;inset:7px;border:1.5px solid var(--cov-gold);border-radius:2px;pointer-events:none}
.cover::after{content:"";position:absolute;inset:13px;border:1px solid rgba(197,158,87,.45);pointer-events:none}
.cover h1{font-size:clamp(1.7rem,6vw,2.7rem);letter-spacing:.06em;text-transform:uppercase;color:var(--cov-ink);line-height:1.1;margin:6px 0}
.cover .sub{font-family:var(--sc);font-size:1.05rem;letter-spacing:.14em;color:var(--cov-gold)}
.cn{position:absolute;width:34px;height:34px;color:var(--cov-gold);z-index:1}
.cn.tl{top:3px;left:3px}.cn.tr{top:3px;right:3px;transform:scaleX(-1)}.cn.bl{bottom:3px;left:3px;transform:scaleY(-1)}.cn.br{bottom:3px;right:3px;transform:scale(-1,-1)}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--cov-gold);margin-top:8px}
.orn i{height:1px;width:min(120px,22vw);background:currentColor;opacity:.7}
.orn svg{width:14px;height:14px}
/* paneles y tarjetas con esquina cortada */
.panel,.card{position:relative;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--plum);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%);min-width:0}
.panel::after,.card::after{content:"";position:absolute;right:0;bottom:0;width:18px;height:18px;
  background:linear-gradient(to top left,transparent calc(50% - 1px),var(--plum) calc(50% - 1px),var(--plum) calc(50% + 1px),transparent calc(50% + 1px))}
.panel{padding:16px 16px 22px;display:grid;gap:14px}
.card{padding:0 14px 22px;display:flex;flex-direction:column;gap:10px}
.panel>h3:first-child,.card>h3:first-child{margin:0 -16px;padding:8px 16px;background:var(--plum);color:var(--plum-ink);font-family:var(--sc);font-weight:700;font-size:1.2rem;letter-spacing:.05em;overflow-wrap:anywhere}
.card>h3:first-child{margin:0 -14px}
.panel h3:not(:first-child){font-family:var(--sc);font-weight:700;font-size:1.4rem;color:var(--head);border-bottom:1px solid var(--line);padding-bottom:2px;letter-spacing:.02em}
.panel p{margin:0}
.hint{color:var(--muted);font-size:.98rem}
.lead::first-letter{float:left;font-family:var(--display);font-weight:700;font-size:3.1em;line-height:.82;color:var(--head);padding:4px 8px 0 0}
.meta{color:var(--muted);font-size:.95rem;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty{background:var(--surface);border:1.5px dashed var(--plum);border-radius:6px;padding:28px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-size:1.4rem;color:var(--head)}
.empty p{margin:0;max-width:46ch;color:var(--muted)}
/* cabecera de capítulo */
.chapter{position:relative;display:grid;justify-items:center;padding-top:28px;margin-bottom:14px}
.mist{position:absolute;left:0;right:0;top:0;height:94px;border-radius:6px;overflow:hidden;
  background:radial-gradient(60% 140% at 18% 0,var(--mist-a),transparent 70%),radial-gradient(50% 120% at 84% 20%,var(--pink),transparent 70%),linear-gradient(100deg,var(--mist-c),var(--mist-b) 45%,var(--mist-c))}
.mist::after{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='200'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.011 .02' numOctaves='4' seed='7'/%3E%3CfeColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.6 -.55'/%3E%3C/filter%3E%3Crect width='400' height='200' filter='url(%23n)'/%3E%3C/svg%3E") center/400px 200px;opacity:.55;mix-blend-mode:soft-light}
.tab{position:relative;z-index:1;background:var(--bg);border:2.5px solid var(--frame);border-bottom:0;border-radius:14px 14px 0 0;padding:2px 22px 0;font-family:var(--sc);font-weight:700;letter-spacing:.1em;font-size:.95rem;color:var(--head);max-width:100%}
.cart{position:relative;z-index:1;display:flex;align-items:center;gap:10px;background:var(--bg);border:2.5px solid var(--frame);border-radius:999px;padding:6px 10px;max-width:100%;min-width:min(100%,280px)}
.cart h2{font-size:clamp(1.05rem,4.6vw,1.6rem);color:var(--head);text-transform:uppercase;letter-spacing:.03em;flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.med{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:3px solid var(--plum);display:grid;place-items:center;color:var(--head);background:var(--surface)}
.med svg{width:24px;height:24px}
/* pasos */
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:10px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--field);border-radius:6px;padding:7px 12px;font-weight:600;font-size:.9rem;display:flex;gap:7px;align-items:center;min-height:42px}
.chip[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:0 0 auto}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
.chip[aria-current="step"] .dot{box-shadow:0 0 0 2px var(--accent-ink)}
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
/* formularios */
label.f{display:grid;gap:4px;font-weight:600;font-size:.9rem;min-width:0;color:var(--ink)}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:44px;font-weight:400;font-size:1rem}
textarea{min-height:84px;resize:vertical}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 150px;border:1.5px solid var(--line);background:var(--field);border-radius:4px 14px 4px 14px;padding:10px 12px;min-height:50px;text-align:left}
.seg button[aria-pressed="true"]{border-color:var(--frame);box-shadow:inset 0 0 0 1.5px var(--frame)}
.seg b{display:block;font-size:.98rem}
.seg span{font-size:.84rem;color:var(--muted);font-weight:400}
.tag,.era{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-radius:3px;padding:2px 6px;vertical-align:middle;line-height:1.3}
.tag{border:1px solid var(--line);color:var(--muted)}
.era{background:#6E6969;color:#fff}.era.e2{background:var(--gold);color:#2A2325}
.counter{display:inline-flex;gap:8px;align-items:baseline;font-weight:700}
.counter.warn{color:var(--warn)}.counter.ok{color:var(--ok)}
.counter .n{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1.5px solid var(--line);border-radius:4px 14px 4px 14px;padding:8px 10px;background:var(--field);min-width:0}
.item .nm{min-width:0;flex:1}
.item .nm b{display:block;overflow-wrap:anywhere}
.item .nm span{font-size:.84rem;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.step button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--frame);background:var(--surface);font-size:1.3rem;font-weight:700;line-height:1;color:var(--head)}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step output{min-width:34px;text-align:center;font-family:var(--display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.step .bonus{font-size:.8rem;color:var(--gold-ink);font-weight:700}
.mod{font-variant-numeric:tabular-nums;font-weight:700;min-width:38px;text-align:right}
.lock{font-size:.78rem;color:var(--gold-ink);font-weight:700}
/* hoja */
.side{position:sticky;top:12px}
@media(max-width:959px){.side{position:static;order:-1}.side .kv,.side h3{display:none}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--field);border:1.5px solid var(--line);border-radius:4px 14px 4px 14px;padding:8px 6px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--head)}
.stat span{font-size:.7rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.stat.inv b{color:var(--gold-ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
table.sk{width:100%;border-collapse:collapse;font-size:.95rem}
table.sk td{padding:5px 4px;border-bottom:1px solid var(--line)}
table.sk td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
table.sk td.g{color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.sheetgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.sheetgrid>div{min-width:0}
.sheetgrid h4{margin:0 0 6px;font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;color:var(--head);border-bottom:1px solid var(--line);padding-bottom:3px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--cov-bg);border-top:2px solid var(--cov-gold);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.nav .in{max-width:1180px;margin-inline:auto;display:flex;gap:10px;justify-content:space-between}
.nav .btn{flex:1;max-width:260px;background:transparent;color:var(--cov-gold);border-color:var(--cov-gold)}
.nav .btn.pri{background:var(--cov-gold);color:#1E2225}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--cov-bg);color:var(--cov-gold);border:1.5px solid var(--cov-gold);padding:10px 16px;border-radius:6px;z-index:9;font-weight:600;max-width:90vw}
dialog{border:2px solid var(--frame);border-radius:6px;background:var(--surface);color:var(--ink);padding:16px;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(20,22,24,.6)}
dialog h3{font-family:var(--sc);font-size:1.4rem;color:var(--head)}
.emb{display:block;width:92px;height:92px;margin:2px auto 8px;color:var(--cov-gold)}
.cos{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:600;font-size:clamp(.78rem,3.4vw,1rem);letter-spacing:.2em;text-transform:uppercase;color:var(--cov-gold);margin:0 0 6px}
.cos i{flex:0 1 38px;height:1px;background:currentColor;opacity:.7}
.cover.login{padding:34px 24px 26px;background:radial-gradient(70% 55% at 50% 30%,rgba(197,158,87,.22),transparent 70%),radial-gradient(120% 40% at 50% 100%,rgba(216,214,214,.10),transparent 80%),linear-gradient(180deg,var(--cov-bg),var(--cov-bg2));margin-top:14px;margin-bottom:22px}
.cover.login .emb{width:116px;height:116px;margin:0 auto 10px;filter:drop-shadow(0 0 14px rgba(197,158,87,.45))}
.cos{display:block;margin:0 0 10px}
.cos small{display:block;font-family:var(--sc);font-size:clamp(.95rem,4vw,1.15rem);letter-spacing:.42em;text-indent:.42em;color:var(--cov-ink);opacity:.85}
.cos b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(1.15rem,5.7vw,2.4rem);letter-spacing:.1em;text-indent:.1em;white-space:nowrap;text-transform:uppercase;line-height:1.1;color:var(--cov-gold);text-shadow:0 2px 12px rgba(0,0,0,.45)}
.auth{position:relative;border:1.5px solid var(--frame);box-shadow:0 0 0 4px var(--bg),0 0 0 5.5px color-mix(in srgb,var(--frame) 45%,transparent),0 14px 30px -18px rgba(0,0,0,.5);padding:22px 20px 20px}
.panel.auth .ah{background:none!important;color:var(--head);padding:0;margin-inline:0;display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:14px;font-size:1.5rem;letter-spacing:.06em}
.auth .ah i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold));max-width:90px}
.auth .ah i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.auth .btn.pri[type=submit]{min-height:50px;font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;border-radius:4px 14px 4px 14px}
.auth .seg{margin-bottom:14px;flex-wrap:nowrap}.auth .seg button{flex:1 1 0;text-align:center;min-width:0}
.acct{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px;font-family:var(--sans);font-size:.95rem;color:var(--muted)}
.menu{max-width:520px;margin-inline:auto;border:1.5px solid var(--frame);padding:22px 18px 20px}
.panel.menu .ah,.panel.auth .ah{color:var(--head)!important}
.menu .ah{display:flex;align-items:center;gap:12px;justify-content:center;font-size:1.25rem;letter-spacing:.05em;text-align:center;background:none!important;color:var(--head);padding:0;margin:0}
.menu .ah i{flex:1;height:1px;max-width:60px;background:linear-gradient(90deg,transparent,var(--gold))}.menu .ah i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.mcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:84px;padding:14px;border:1.5px solid var(--frame);background:var(--field);border-radius:4px 16px 4px 16px;font-family:var(--sans)}

.authhub .seg button{flex:1 1 0;min-width:0;min-height:42px;border:0;border-radius:11px;background:transparent;color:var(--h-mut);text-align:center;box-shadow:none;padding:6px}
.authhub .seg button[aria-pressed="true"]{background:var(--h-card);color:var(--h-ink);box-shadow:0 1px 4px rgba(20,30,60,.2)}
.authhub label.f{color:var(--h-mut);font-size:.84rem;font-weight:600}
.authhub input[type=text],.authhub input[type=password],.authhub textarea{width:100%;min-height:48px;margin-top:6px;border:1px solid var(--h-line);background:var(--h-bg);color:var(--h-ink);border-radius:14px;padding:10px 14px;font-size:1rem}
.authhub input:focus{outline:2px solid #4F46E5;outline-offset:1px}
.authhub .pw{display:flex;gap:8px;align-items:stretch}.authhub .pw input{flex:1;min-width:0}
.authhub .pw .btn{margin-top:6px;border-radius:14px}
.authhub .btn{border:1px solid var(--h-line);background:var(--h-card);color:var(--h-ink);border-radius:14px}
.authhub .btn.pri{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;border:0;min-height:52px;font-size:1rem;font-weight:700;box-shadow:0 10px 20px -12px rgba(79,70,229,.8)}
.authhub .btn.ghost{background:transparent}
.authhub .chk{color:var(--h-ink)}.authhub .chk input{accent-color:#4F46E5}
.authhub .hint{color:var(--h-mut);font-size:.84rem;margin:0}
.authhub .msg.err{color:#D9480F}.authhub .msg.ok{color:#2B8A3E}
.auth{max-width:520px;margin-inline:auto}
.msg{min-height:1.5em;font-family:var(--sans);font-size:.92rem;overflow-wrap:anywhere}
.msg.err{color:var(--warn)}.msg.ok{color:var(--ok)}
.pw{display:flex;gap:8px}.pw input{flex:1;min-width:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-family:var(--sans);font-size:.92rem}
.chk input{width:22px;height:22px;margin-top:2px;flex:0 0 auto;accent-color:var(--accent)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qt{font-family:var(--display);font-weight:700;font-size:clamp(1.2rem,4.6vw,1.65rem);line-height:1.25;color:var(--head);text-wrap:balance}
.qs{font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-family:var(--sans)}
.seg.col button{flex:1 1 100%}
.seg .opt{display:block;font-size:.8rem;color:var(--gold-ink);font-weight:600;margin-top:2px}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.qbig{display:flex;gap:8px;flex-wrap:nowrap}
.qbig button{min-width:0;flex:1 1 0;min-height:64px;border:1.5px solid var(--line);background:var(--field);border-radius:4px 14px 4px 14px;font-family:var(--display);font-size:1.6rem;font-weight:700}
.qbig button small{display:block;font-family:var(--sans);font-size:.75rem;font-weight:600;color:var(--muted)}
.qbig button[aria-pressed="true"]{border-color:var(--frame);box-shadow:inset 0 0 0 1.5px var(--frame);color:var(--head)}
.qbig button:disabled{opacity:.3;cursor:not-allowed}
@media(max-width:959px){.qside{display:none}}
@media(prefers-reduced-motion:no-preference){.panel{animation:in .18s ease-out}@keyframes in{from{opacity:.5}}}

 presencia:{n:'Presencia',d:'Intelecto +1 y Presencia +1',b:{int:1,pre:1}},estabilidad:{n:'Estabilidad',d:'Voluntad +2',b:{vol:2}},fortaleza:{n:'Fortaleza',d:'Desvío +1',b:{},def:1}};

const KITS={
 bajos:{n:'Bajos fondos',w:'Dos armas ligeras',a:'Armadura de cuero',g:'Mochila con ropa común, botella de whisky, nudillera, palanca, ganzúa, 15 m de cuerda, pedernal y acero, lámpara de aceite, frasco de aceite y comida callejera para 5 días',dice:[1,20]},
 fugitivo:{n:'Fugitivo',w:'',a:'',g:'Ropa raída',dice:null,note:'Ruptura: si tomas un camino alomántico, completas de inmediato la meta "Entrenar tu poder".'},
 noble:{n:'Noble',w:'Bastón de duelo y un arma ligera',a:'',g:'Una botella de vino selecto o whisky y ropa elegante',dice:[4,20],note:'Tienes un patrocinador de tu casa noble.'},
 guardador:{n:'Guardador',w:'',a:'',g:'Ropa buena (túnica)',dice:null,note:'Si tomas un camino feruquímico, completas de inmediato la meta "Fabricar tu(s) mente(s) de metal".'},
 indagador:{n:'Indagador',w:'Cuchillo (Era 1) o pistola de bota (Era 2)',a:'Uniforme',g:'Mochila con ropa común, cálamo, frasco de tinta, 20 hojas de papel, linterna, libro de referencia y cerradura con su llave',dice:[3,12],note:'Pericia adicional: Literatura.'},
 mercenario:{n:'Mercenario',w:'Un arma no especial',a:'Uniforme y coraza',g:'Mochila con ropa común, odre, lupa, palanca, grilletes y raciones para 10 días',dice:[2,6]},
 otro:{n:'Otro (consulta el cap. 7)',w:'',a:'',g:'',dice:null}};
const TIER=v=>v<=0?0:v<=2?1:v<=4?2:v<=6?3:v<=8?4:5;
const LIFT=[50,100,250,500,2500,5000], MOVE=[6,7.5,9,12,18,24], DIE=['d4','d6','d8','d10','d12','d20'], SENSE=['1,5 m','3 m','6 m','15 m','30 m','sin límite'];

/* ---------- estado ---------- */
/* ---------- cuentas locales, cifradas con la contraseña ---------- */
const AKEY='fichas-scadrial-cuentas-v1',SKEY='fichas-scadrial-sesion-v1',LEGACY='fichas-scadrial-v1',ITER=150000;
let accounts={users:{}},session=null,store={chars:[],cur:null},scr='menu',authTab='login',authBusy=false,fails=0,booting=true;
const ADMIN='alpha';
const isAdmin=()=>!!session&&session.user===ADMIN;
let admState=null;
const hasCrypto=!!(window.crypto&&crypto.subtle);
const b64=u=>{let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)};
const unb64=t=>Uint8Array.from(atob(t),ch=>ch.charCodeAt(0));
const nameN=u=>String(u||'').normalize('NFC').trim().replace(/\s+/g,' ');
const nameK=u=>nameN(u).toLowerCase();
function loadAccounts(){try{const t=localStorage.getItem(AKEY);if(t){const o=JSON.parse(t);if(o&&o.users)accounts=o}}catch(e){}}
function storeAccounts(){try{localStorage.setItem(AKEY,JSON.stringify(accounts));return true}catch(e){toast('No se pudo guardar en este navegador');return false}}
function legacyChars(){try{const o=JSON.parse(localStorage.getItem(LEGACY)||'null');return o&&Array.isArray(o.chars)?o.chars:[]}catch(e){return[]}}
async function kdf(pw,salt,iter){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveBits']);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},km,512));return {auth:bits.slice(0,32),raw:bits.slice(32)}}
const aesKey=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function enc(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));return {iv:b64(iv),ct:b64(ct)}}
async function dec(key,d){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(d.iv)},key,unb64(d.ct));return JSON.parse(new TextDecoder().decode(pt))}
let saveT=null;
function save(){if(!session)return;clearTimeout(saveT);saveT=setTimeout(flush,250)}
async function flush(){if(!session)return;clearTimeout(saveT);try{const d=await enc(session.key,{chars:store.chars,avatar:store.avatar||''});loadAccounts();const rec=accounts.users[session.user];if(!rec)return;rec.data=d;rec.updated=Date.now();storeAccounts()}catch(e){}}
function ckGet(k){try{const m=document.cookie.split('; ').find(x=>x.indexOf(k+'=')===0);return m?decodeURIComponent(m.slice(k.length+1)):''}catch(e){return ''}}
function ckSet(k,v){try{document.cookie=k+'='+encodeURIComponent(v)+'; max-age=31536000; path=/; SameSite=None; Secure'}catch(e){}}
function ckDel(k){try{document.cookie=k+'=; max-age=0; path=/; SameSite=None; Secure'}catch(e){}}
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{localStorage.setItem(k,v);return localStorage.getItem(k)===v}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function skGet(){let v='';try{v=sessionStorage.getItem(SKEY)||''}catch(e){}return v||lsGet(SKEY)||ckGet(SKEY)||null}
function skClear(){try{sessionStorage.removeItem(SKEY)}catch(e){}lsDel(SKEY);ckDel(SKEY)}
function skSet(o,rem){const t=JSON.stringify(o);try{sessionStorage.removeItem(SKEY)}catch(e){}lsDel(SKEY);ckDel(SKEY);if(rem){const ok=lsSet(SKEY,t);ckSet(SKEY,t);return ok||!!ckGet(SKEY)}try{sessionStorage.setItem(SKEY,t)}catch(e){}return true}
function skRem(){return !!(lsGet(SKEY)||ckGet(SKEY))}
let wantRem=false;
const UKEY='mesa-larga-usuario';
function lastUser(){return lsGet(UKEY)||ckGet(UKEY)||''}
function startSession(k,rec,key,raw,chars,av){session={user:k,name:rec.name,key,raw};scr='menu';store={chars:chars,cur:null,avatar:avOk(av)};const rem=wantRem;const okS=skSet({user:k,raw:b64(raw)},rem);wantRem=false;
 if(rem){lsSet(UKEY,rec.name);ckSet(UKEY,rec.name)}else if(!skRem()){lsDel(UKEY);ckDel(UKEY)}
 if(rem&&(!okS||!lastUser()))setTimeout(()=>{try{toast('Tu navegador no permite recordar el usuario en este dispositivo.')}catch(x){}},700)}
async function restoreSession(){try{const t=skGet();if(!t)return false;const o=JSON.parse(t);const rec=accounts.users[o.user];if(!rec)return false;
 const raw=unb64(o.raw);const key=await aesKey(raw);const d=await dec(key,rec.data);wantRem=skRem();startSession(o.user,rec,key,raw,Array.isArray(d.chars)?d.chars:[],d.avatar);return true}
 catch(e){skClear();setTimeout(()=>{try{toast('No se pudo recuperar la sesión guardada. Entra de nuevo.')}catch(x){}},800);return false}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function authView(){
 const leg=legacyChars().length;
 const tabs=[['login','Entrar'],['new','Crear cuenta']].map(([k,n])=>`<button type="button" data-act="atab" data-v="${k}" aria-pressed="${authTab===k}"><b>${n}</b></button>`).join('');
 const pwf=(id,label,auto)=>`<label class="f">${label}<span class="pw"><input type="password" id="${id}" name="${id}" data-pw="1" autocomplete="${auto}" required><button type="button" class="btn sm" data-act="showpw" aria-pressed="false">Ver</button></span></label>`;
 let form='';
 if(authTab==='restore')form=`<form id="authform" novalidate class="grid"><p class="hint">Pega aquí una copia de seguridad que hayas copiado desde otro dispositivo. Después entra con la contraseña de esa cuenta.</p>
  <label class="f">Copia de seguridad<textarea name="bk" id="bk" rows="5" placeholder="FSC1:…"></textarea></label><div id="amsg" class="msg" role="alert" aria-live="polite"></div>
  <div class="row"><button class="btn pri" type="submit">Restaurar cuenta</button><button type="button" class="btn ghost" data-act="atab" data-v="login">Volver</button></div></form>`;
 else form=`<form id="authform" novalidate class="grid">
  <label class="f">Usuario<input type="text" id="au" name="au" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(authTab==='login'?lastUser():'')}" required></label>
  ${pwf('ap','Contraseña',authTab==='new'?'new-password':'current-password')}
  ${authTab==='new'?pwf('ap2','Repite la contraseña','new-password'):''}
  ${authTab==='new'&&leg?`<label class="chk"><input type="checkbox" name="leg" checked><span>Traer a esta cuenta las ${leg} ficha${leg===1?'':'s'} que ya tenías guardada${leg===1?'':'s'} en este dispositivo. Se quitarán del almacenamiento sin cifrar.</span></label>`:''}
  <label class="chk rem"><input type="checkbox" name="rem" id="rem" ${authTab==='login'&&lastUser()?'checked':''}><span><b>Recordar en este dispositivo</b><br>Seguirás con la sesión abierta al volver. Úsalo solo en un dispositivo tuyo.</span></label>
  <div id="amsg" class="msg" role="alert" aria-live="polite"></div>
  <button class="btn pri" type="submit">${authTab==='new'?'Crear cuenta':'Entrar'}</button></form>`;
 return `${BGD}<div class="lgt">${themeSeg()}</div><div class="lg"><div class="logo">${DIEI}</div><h1 class="hh">La Mesa Larga</h1><div class="tg">Tus partidas, tus fichas</div><p class="hs">${authTab==='new'?'Crea tu cuenta para guardar tus partidas y fichas.':authTab==='restore'?'Recupera una cuenta desde una copia de seguridad.':'Inicia sesión para continuar.'}</p></div>
 <section class="authhub">
 ${hasCrypto?'':'<p class="warn-t">Este navegador no permite crear cuentas seguras. Abre la app en un navegador actual (Safari, Chrome, Firefox).</p>'}
 ${authTab==='restore'?'':`<div class="seg">${tabs}</div>`}${form}
 ${authTab==='new'?'<p class="hint">El usuario ALPHA está reservado para el administrador de este dispositivo: la primera persona que lo crea elige su contraseña. Cada cuenta tiene sus propias fichas, cifradas con tu contraseña. Si la olvidas, no hay forma de recuperarlas.</p>':''}
 ${authTab==='login'?`<div class="row"><button type="button" class="btn ghost sm" data-act="atab" data-v="restore">Tengo una copia de seguridad</button></div><p class="hint">Las cuentas se guardan solo en este dispositivo y navegador. Para usar la tuya en otro, haz una copia de seguridad desde Cuenta.</p>`:''}</section>`}

async function doAuth(f){
 if(authBusy||!hasCrypto)return;const msg=$('#amsg');const set=(t,k)=>{msg.textContent=t;msg.className='msg '+(k||'')};const btn=f.querySelector('button[type=submit]');const el=n=>f.elements[n];
 authBusy=true;btn.disabled=true;
 try{
  if(authTab==='restore'){
   const t=(el('bk').value||'').trim();if(!t.startsWith('FSC1:')){set('Ese texto no es una copia de seguridad.','err');return}
   let rec;try{rec=JSON.parse(new TextDecoder().decode(unb64(t.slice(5))))}catch(e){set('La copia de seguridad está dañada o incompleta.','err');return}
   if(!rec||!rec.name||!rec.salt||!rec.auth||!rec.data||!rec.data.ct||!rec.iter){set('La copia de seguridad está dañada o incompleta.','err');return}
   loadAccounts();const k=nameK(rec.name);if(accounts.users[k]){set('Ya hay una cuenta con ese nombre en este dispositivo.','err');return}
   accounts.users[k]={name:rec.name,salt:rec.salt,iter:rec.iter,auth:rec.auth,data:rec.data,created:rec.created||Date.now()};if(!storeAccounts())return;
   authTab='login';render();const m=$('#amsg');m.textContent='Cuenta restaurada. Entra con tu usuario y contraseña.';m.className='msg ok';return}
  const name=nameN(el('au').value),pw=el('ap').value,k=name.toLowerCase();wantRem=!!(el('rem')&&el('rem').checked);
  if(authTab==='new'){
   if(name.length<3||name.length>24||!/^[\p{L}\p{N} ._-]+$/u.test(name)){set('El usuario debe tener entre 3 y 24 caracteres: letras, números, espacios, punto, guion o guion bajo.','err');return}
   loadAccounts();if(accounts.users[k]){set('Ese usuario ya existe en este dispositivo.','err');return}
   if(pw.length<6){set('La contraseña debe tener al menos 6 caracteres.','err');return}
   if(pw!==el('ap2').value){set('Las contraseñas no coinciden.','err');return}
   set('Creando la cuenta…');
   const salt=crypto.getRandomValues(new Uint8Array(16));const dk=await kdf(pw,salt,ITER);const key=await aesKey(dk.raw);
   const takeLeg=el('leg')&&el('leg').checked;const chars=takeLeg?legacyChars().map(normalize):[];
   const rec={name,salt:b64(salt),iter:ITER,auth:b64(dk.auth),data:await enc(key,{chars}),created:Date.now()};
   accounts.users[k]=rec;if(!storeAccounts()){delete accounts.users[k];return}
   if(takeLeg){try{localStorage.removeItem(LEGACY)}catch(e){}}
   startSession(k,rec,key,dk.raw,chars);render();toast('Cuenta creada');return}
  loadAccounts();const rec=accounts.users[k];set('Comprobando…');
  if(fails>0)await wait(Math.min(fails*700,5000));
  let ok=false;
  if(rec){try{const dk=await kdf(pw,unb64(rec.salt),rec.iter);if(b64(dk.auth)===rec.auth){const key=await aesKey(dk.raw);const d=await dec(key,rec.data);startSession(k,rec,key,dk.raw,Array.isArray(d.chars)?d.chars:[],d.avatar);ok=true}}catch(e){}}
  if(!ok){fails++;set(rec?'La contraseña no es correcta para ese usuario. Pulsa «Ver» para comprobar lo que escribes.':'No hay ninguna cuenta con ese usuario en este navegador y dirección. Si tu cuenta está en otra dirección o dispositivo, usa «Tengo una copia de seguridad».','err');return}
  fails=0;render();
 }catch(e){set('Algo ha fallado. Inténtalo de nuevo.','err')}
 finally{authBusy=false;const b=f.querySelector('button[type=submit]');if(b)b.disabled=false}}

function bonus(c){const b={fue:0,vel:0,int:0,vol:0,dis:0,pre:0};let def=0;

function pathInfo(c){return PATHS[c.path]||null}

function hasInvest(c){const p=METAL[c.path];return !!p&&(p.alo)}

function skillList(c){const l=SKILLS.slice();const p=METAL[c.path];if(p){if(p.alo)l.push(['alomancia','Alomancia','vol','inv']);if(p.fer)l.push(['feruquimia','Feruquimia','int','inv'])}return l}

function derive(c){const t=totals(c),{def}=bonus(c);const kol=c.ancestry==='koloss'?1:0;
 const d={t,salud:10+t.fue+kol,conc:2+t.vol,
  fis:10+t.fue+t.vel,cog:10+t.int+t.vol,esp:10+t.dis+t.pre,
  lift:LIFT[TIER(t.fue)],move:MOVE[TIER(t.vel)],die:DIE[TIER(t.vol)],sense:SENSE[TIER(t.dis)],desvio:(+c.deflect||0)+def};
 d.inv=hasInvest(c)?2+Math.max(t.dis,t.pre):null;
 d.extraPer=t.int+(c.kit==='indagador'?1:0);return d}

  const comp=`<div class="comp ${full?'full':'part'}"><div class="cpH"><span class="cpB">${full?'✓ Completa':'Incompleta'}</span><span class="cpN">${okN}/7 pasos</span></div><div class="pips" aria-hidden="true">${sts.map(x=>`<i class="${x[1]==='ok'?'on':''}"></i>`).join('')}</div>${full?'':`<div class="cpM">Falta: ${miss.map(esc).join(', ')}</div>`}</div>`;
  return `<article class="card" data-cid="${c.id}"><h3>${esc(c.name||'Sin nombre')}</h3>
  <div class="meta">${eraTag(c.era)}<span>${anc} · ${p?esc(p.n):'sin camino'} · nivel ${c.level}</span></div>
  ${comp}
  <div class="stats"><div class="stat"><b>${d.salud}</b><span>Salud</span></div><div class="stat"><b>${d.conc}</b><span>Conc.</span></div><div class="stat"><b>${d.fis}/${d.cog}/${d.esp}</b><span>Defensas</span></div></div>
  <div class="row"><button class="btn pri" data-act="open" data-id="${c.id}">Abrir</button><button class="btn" data-act="dup" data-id="${c.id}">Duplicar</button>
  <button class="btn ghost" data-act="askdel" data-id="${c.id}">Borrar</button></div></article>`}).join('');
 return `<header class="cover">${corners}<div class="sub">Juego de rol del Cosmere</div><h1>Fichas de Scadrial</h1><div class="sub">Nacidos de la Bruma</div>
 <div class="orn"><i></i>${DIAMOND}<i></i></div></header>
 ${acctBar()}
 <div class="top"><div class="row"><button class="btn ghost" data-act="rol">‹ Rol</button><button class="btn pri" data-act="new">Nueva ficha</button><button class="btn" data-act="import">Importar</button></div></div>
 ${store.chars.length?`<div class="grid cards">${cards}</div>`:
 `<div class="empty"><h2>Aún no hay personajes</h2><p>Crea uno siguiendo los ocho pasos del manual. La app calcula salud, concentración, Investidura, defensas y modificadores mientras eliges. Todo se guarda en este dispositivo.</p>
 <div class="row" style="justify-content:center"><button class="btn pri" data-act="new">Crear la primera ficha</button><button class="btn" data-act="sample">Ver un ejemplo inventado</button></div></div>`}
 <p class="hint" style="margin-top:16px">Tus fichas se guardan cifradas en este dispositivo, dentro de tu cuenta. Para llevarlas a otro, usa Cuenta y copia de seguridad; para pasar una sola, usa Exportar dentro de la ficha.</p>`}

function statsPanel(c){const d=derive(c);
 return `<div class="panel"><h3>Hoja calculada</h3>
 <div class="stats"><div class="stat"><b>${d.salud}</b><span>Salud</span></div><div class="stat"><b>${d.conc}</b><span>Concentr.</span></div>
 <div class="stat inv"><b>${d.inv===null?'—':d.inv}</b><span>Investidura</span></div>
 <div class="stat"><b>${d.fis}</b><span>Def. física</span></div><div class="stat"><b>${d.cog}</b><span>Def. cognitiva</span></div><div class="stat"><b>${d.esp}</b><span>Def. espiritual</span></div></div>
 <dl class="kv"><dt>Levantamiento</dt><dd>${d.lift} kg</dd><dt>Movimiento</dt><dd>${d.move} m / acción</dd><dt>Dado de recuperación</dt><dd>${d.die}</dd><dt>Alcance de sentidos</dt><dd>${d.sense}</dd><dt>Desvío</dt><dd>${d.desvio}</dd></dl></div>`}

function editor(c){
 const i=c.step;
 const chips=STEPS.map((s,k)=>{const st=status(c,k);return `<button class="chip" data-act="go" data-i="${k}" ${k===i?'aria-current="step"':''}><span class="dot ${st}"></span>${k+1}. ${s}</button>`}).join('');
 const bodies=[sOrig,sCamino,sAttr,sHab,sTal,sEq,sHist,sHoja];
 return `<div class="top"><button class="btn" data-act="home">‹ Mis fichas</button><div class="row"><button class="btn sm" data-act="qmode">Modo preguntas</button><button class="btn sm" data-act="export">Exportar</button></div></div>
 <header class="chapter"><div class="mist"></div><div class="tab">Paso ${i+1} · ${STEPS[i]}</div><div class="cart"><span class="med">${GLYPH_A}</span><h2 id="ttl">${esc(c.name||'Personaje sin nombre')}</h2><span class="med">${GLYPH_B}</span></div></header>
 <nav class="steps" aria-label="Pasos">${chips}</nav>
 <div class="layout"><div id="body">${bodies[i](c)}</div><div id="side" class="side">${statsPanel(c)}</div></div>
 <div class="nav"><div class="in"><button class="btn" data-act="prev" ${i===0?'disabled':''}>Anterior</button><button class="btn pri" data-act="next" ${i===7?'disabled':''}>Siguiente</button></div></div>`}

function sOrig(c){
 const cl=[...CULT1.filter(()=>c.era===1),...CULT2.filter(()=>c.era===2),...CULTB];
 const sel=n=>{const v=c.cultures[n];const known=cl.includes(v);return `<label class="f">Pericia cultural ${n+1}<select data-f="cultures.${n}" data-r="1"><option value="">Elegir…</option>${cl.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}${v&&!known?`<option selected>${esc(v)}</option>`:''}</select></label>`};
 const anc=[['humano','Humano','Un talento adicional de camino heroico'],['kandra','Kandra','6 puntos de atributo y una Bendición'],...(c.era===2?[['koloss','Sangre koloss','Fuerza hasta 4; +1 salud · Era 2']]:[])];
 return `<section class="panel"><h3>Paso 1. Orígenes</h3>
 <p class="hint lead">Tu ascendencia es de quién desciendes; tu cultura, dónde creciste. Pueden no coincidir.</p>
 <label class="f">Nombre del personaje<input type="text" id="f-name" data-f="name" value="${esc(c.name)}" autocomplete="off"></label>
 <label class="f">Nombre del jugador<input type="text" data-f="player" value="${esc(c.player)}" autocomplete="off"></label>
 <div class="f"><span style="font-weight:600;font-size:.92rem">Era de la partida</span><div class="seg">
  <button data-act="era" data-v="1" aria-pressed="${c.era===1}"><b>${eraTag(1)} Imperio Final</b><span>Imperio Final y Colapso</span></button>
  <button data-act="era" data-v="2" aria-pressed="${c.era===2}"><b>${eraTag(2)} Tras el Catacendro</b><span>Tras el Catacendro</span></button></div></div>
 <div class="f"><span style="font-weight:600;font-size:.92rem">Ascendencia</span><div class="seg">${anc.map(a=>`<button data-act="anc" data-v="${a[0]}" aria-pressed="${c.ancestry===a[0]}"><b>${a[1]}</b><span>${a[2]}</span></button>`).join('')}</div></div>
 ${c.ancestry==='kandra'?`<div class="f"><span style="font-weight:600;font-size:.92rem">Bendición kandra</span><div class="seg">${Object.entries(BLESS).map(([k,b])=>`<button data-act="bless" data-v="${k}" aria-pressed="${c.blessing===k}"><b>${b.n}</b><span>${b.d}</span></button>`).join('')}</div></div>`:''}
 <div class="two">${sel(0)}${sel(1)}</div>
 <p class="hint">Elige dos pericias culturales. Las de ${c.era===1?'la Era 1':'la Era 2'} y las comunes a ambas eras aparecen en la lista.</p></section>`}

function metalPick(c,kind,n,label,opts){
 let h='';for(let k=0;k<n;k++){const v=c.powers[kind][k]||'';h+=`<label class="f">${label}${n>1?' '+(k+1):''}<select data-f="powers.${kind}.${k}" data-r="1"><option value="">Elegir…</option>${opts.map(o=>`<option value="${o[0]}" ${v===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`}return h}
function sCamino(c){
 const avail=Object.entries(PATHS).filter(([k,p])=>!p.era||p.era.includes(c.era));
 const heroic=avail.filter(([k])=>HEROIC[k]),metal=avail.filter(([k])=>METAL[k]);
 const btn=([k,p])=>`<button data-act="path" data-v="${k}" aria-pressed="${c.path===k}"><b>${p.n}${p.era&&p.era.length===1?' '+eraTag(p.era[0]):''}${p.exp?' <span class="tag">experto</span>':''}</b><span>${esc(p.d)}</span></button>`;
 let powers='';const p=METAL[c.path];
 if(p){const n=pathNeeds(c);
  const aloOpts=ALO_METALS.filter(m=>c.era===2||m[2]<2).map(m=>[m[0],m[1]+(m[2]===1&&c.era===1?' (solo al final de la Era 1)':'')]);
  powers=`<div class="two">${n.alo?metalPick(c,'alo',n.alo,'Poder alomántico',aloOpts):''}${n.fer?metalPick(c,'fer',n.fer,'Poder feruquímico',FER_METALS.map(m=>[m,m])):''}</div>
  ${p.alo==='all'?'<p class="hint">Este camino domina todos los poderes alománticos.</p>':''}${p.fer==='all'?'<p class="hint">Este camino domina todos los poderes feruquímicos.</p>':''}
  <p class="hint">Al empezar solo tienes la versión naciente del poder; se desbloquea del todo al cumplir una meta de nacido del metal. Los detalles están en el cap. 6 del manual.</p>`}
 return `<section class="panel"><h3>Paso 2. Camino inicial</h3>
 <p class="hint lead">Los caminos heroicos dan capacidades mundanas; los de nacido del metal, poderes alománticos o feruquímicos. Los de nacido del metal son excluyentes entre sí${c.ancestry==='kandra'?'. Un kandra no puede elegirlos':''}.</p>
 <h4 style="margin:0">Caminos heroicos</h4><div class="seg">${heroic.map(btn).join('')}</div>
 ${c.ancestry==='kandra'?'':`<h4 style="margin:0">Caminos de nacido del metal</h4><div class="seg">${metal.map(btn).join('')}</div>`}
 ${powers}</section>`}

function sAttr(c){
 const t=totals(c),b=bonus(c).b,left=attrBudget(c)-attrSpent(c);
 const rows=ATT.map(([k,n])=>`<div class="item"><div class="nm"><b>${n}</b><span>${{fue:'Salud, levantamiento, Defensa física',vel:'Movimiento, Defensa física',int:'Pericias extra, Defensa cognitiva',vol:'Concentración, recuperación, Defensa cognitiva',dis:'Sentidos, Defensa espiritual, Investidura',pre:'Defensa espiritual, Investidura'}[k]}</span></div>
 <div class="step"><button data-act="att" data-k="${k}" data-d="-1" aria-label="Bajar ${n}" ${c.attrs[k]<=0?'disabled':''}>−</button><output>${c.attrs[k]}</output><button data-act="att" data-k="${k}" data-d="1" aria-label="Subir ${n}" ${(c.attrs[k]>=attrCap(c,k)||left<=0)?'disabled':''}>+</button>
 ${b[k]?`<span class="bonus">+${b[k]}</span>`:''}</div></div>`).join('');
 return `<section class="panel"><h3>Paso 3. Atributos</h3>
 <p class="lead">Reparte <b>${attrBudget(c)} puntos</b>. Máximo ${attrCap(c,'fue')===4?'3 en cada atributo (4 en Fuerza)':'3 en cada uno'}; 0 es válido.</p>
 <div class="counter ${left===0?'ok':'warn'}"><span class="n">${left}</span> puntos por repartir</div>
 <div class="list">${rows}</div>
 ${c.ancestry==='kandra'&&c.blessing?`<p class="hint">La Bendición ${BLESS[c.blessing].n} suma ${BLESS[c.blessing].d.toLowerCase()} (se muestra en naranja).</p>`:''}
 <p class="hint">Valores totales: ${ATT.map(([k,n])=>`${n} ${t[k]}`).join(' · ')}</p></section>`}

function sHab(c){
 const left=4-assignedSkillPts(c),fs=freeSkill(c);
 const rows=skillList(c).map(s=>{const k=s[0],inv=s[3],g=grades(c,k),as=c.skills[k]||0;
  const dis=inv;
  return `<div class="item"><div class="nm"><b>${s[1]}</b><span>${AN[s[2]]} ${derive(c).t[s[2]]} · ${g} grado${g===1?'':'s'}${fs===k?' <span class="lock">1 gratis del camino</span>':''}${inv?' · habilidad Investida':''}</span></div>
  <div class="step">${dis?'':`<button data-act="sk" data-k="${k}" data-d="-1" aria-label="Quitar grado de ${s[1]}" ${as<=0?'disabled':''}>−</button><output>${as}</output><button data-act="sk" data-k="${k}" data-d="1" aria-label="Añadir grado a ${s[1]}" ${(g>=2||left<=0)?'disabled':''}>+</button>`}
  <span class="mod">${sg(mod(c,k))}</span></div></div>`}).join('');
 return `<section class="panel"><h3>Paso 4. Habilidades y pericias</h3>
 <p class="lead">${fs?`Ya tienes <b>1 grado gratis</b> en ${SK[fs][1]}. `:'Tu camino no da grado gratis. '}Reparte <b>4 grados</b> más; máximo 2 grados en cada habilidad.</p>
 <div class="counter ${left===0?'ok':'warn'}"><span class="n">${left}</span> grados por repartir</div>
 <p class="hint">Modificador = grados + atributo (el número de la derecha).</p>
 <div class="list">${rows}</div>
 <h3 style="margin-top:6px">Pericias</h3>
 <p class="hint">Ya tienes tus dos culturales. Además, una pericia por cada punto de Intelecto: <b>${derive(c).extraPer}</b>${c.kit==='indagador'?' (incluye Literatura del equipo Indagador)':''}. Escribe una palabra o expresión: un arma, un tema, una cultura.</p>
 <div class="two">${Array.from({length:derive(c).extraPer},(_,n)=>`<label class="f">Pericia adicional ${n+1}<input type="text" data-f="extra.${n}" value="${esc(c.extra[n]||'')}" autocomplete="off"></label>`).join('')||'<p class="hint">Con Intelecto 0 no tienes pericias adicionales.</p>'}</div></section>`}

function sTal(c){const p=pathInfo(c);
 const anc={humano:`<label class="f">Talento adicional de ascendencia (humano)<input type="text" data-f="talents.ancestry" value="${esc(c.talents.ancestry)}" placeholder="Otro talento de tu camino o el primero de otro camino heroico"></label>`,
  kandra:`<div class="item"><div class="nm"><b>Forma natural y Disfraz kandra</b><span>Talentos de ascendencia kandra, ya incluidos</span></div></div>`,
  koloss:`<div class="item"><div class="nm"><b>Resistencia koloss</b><span>+1 salud máxima; ya incluida en el cálculo</span></div></div>`}[c.ancestry];
 return `<section class="panel"><h3>Paso 5. Talentos</h3>
 ${p?`<div class="item"><div class="nm"><b>${esc(p.talent)}</b><span>Talento principal de ${esc(p.n)}</span></div></div>`:'<p class="hint">Elige un camino en el paso 2 para ver tu talento principal.</p>'}
 ${anc}
 <label class="f">Notas sobre talentos<textarea data-f="talents.notes" placeholder="Describe lo que hace cada talento tal y como aparece en el manual (cap. 4 a 6).">${esc(c.talents.notes)}</textarea></label>
 <p class="hint">Los árboles de talentos completos están en los capítulos 4, 5 y 6 del manual.</p></section>`}

function sEq(c){const k=KITS[c.kit];
 return `<section class="panel"><h3>Paso 6. Equipo</h3>
 <p class="hint lead">Elige un equipo inicial; el nombre no limita tu historia. Luego puedes editar cualquier campo.</p>
 <div class="seg">${Object.entries(KITS).map(([id,x])=>`<button data-act="kit" data-v="${id}" aria-pressed="${c.kit===id}"><b>${x.n}</b></button>`).join('')}</div>
 ${k&&k.note?`<p class="hint">${esc(k.note)}</p>`:''}
 <div class="two"><label class="f">Armas<input type="text" data-f="weapons" value="${esc(c.weapons)}"></label><label class="f">Armadura<input type="text" data-f="armor" value="${esc(c.armor)}"></label></div>
 <label class="f">Equipo<textarea data-f="gear">${esc(c.gear)}</textarea></label>
 <div class="two"><label class="f">Desvío (de la armadura)<input type="number" inputmode="numeric" min="0" data-f="deflect" data-num="1" value="${+c.deflect||0}"></label>
 <label class="f">Arquillas<input type="number" inputmode="numeric" min="0" id="f-ar" data-f="arquillas" data-num="1" value="${+c.arquillas||0}"></label></div>
 ${k&&k.dice?`<div class="row"><button class="btn" data-act="roll">Tirar ${k.dice[0]}d${k.dice[1]}${c.era===2?' × 10':''} arquillas</button><span class="hint">Tirada del equipo inicial${c.era===2?' (Era 2: se multiplica por 10)':''}</span></div>`:''}</section>`}

function sHist(c){
 return `<section class="panel"><h3>Paso 7. Historia</h3>
 <label class="f">Propósito (tu razón de ser)<textarea data-f="purpose">${esc(c.purpose)}</textarea></label>
 <label class="f">Obstáculo (lo que se interpone en el camino)<textarea data-f="obstacle">${esc(c.obstacle)}</textarea></label>
 <div class="two"><label class="f">Meta 1<input type="text" data-f="goals.0" value="${esc(c.goals[0]||'')}"></label><label class="f">Meta 2<input type="text" data-f="goals.1" value="${esc(c.goals[1]||'')}"></label></div>
 ${hasInvest(c)||METAL[c.path]?`<p class="hint">Como nacido del metal tienes además una meta de nacido del metal para desbloquear tu poder (${c.kit==='fugitivo'||c.kit==='guardador'?'tu equipo inicial ya la completa':'consulta el cap. 5'}).</p>`:''}
 <label class="f">Conexiones<input type="text" data-f="connection" value="${esc(c.connection)}" placeholder="Patrocinador, familia, banda…"></label>
 <label class="f">Aspecto del personaje<textarea data-f="look">${esc(c.look)}</textarea></label>
 <label class="f">Ocupación, relaciones, lealtades y personalidad<textarea data-f="notes">${esc(c.notes)}</textarea></label></section>`}

function sHoja(c){const d=derive(c),p=pathInfo(c),t=d.t;
 const per=[...c.cultures.filter(Boolean).map(x=>x+' (cultural)'),...c.extra.filter(x=>x&&x.trim())];
 const sk=skillList(c).map(s=>`<tr><td>${s[1]}</td><td class="g">${AN[s[2]].slice(0,3)}</td><td class="g">${grades(c,s[0])}</td><td>${sg(mod(c,s[0]))}</td></tr>`).join('');
 const pw=[...(METAL[c.path]?c.powers.alo.filter(Boolean).map(x=>(ALO_METALS.find(m=>m[0]===x)||[0,x])[1]):[]),...c.powers.fer.filter(Boolean).map(x=>'Feruquimia de '+x)];
 const meta=METAL[c.path];const allp=meta&&meta.alo==='all'?['Todos los poderes alománticos']:meta&&meta.fer==='all'?['Todos los poderes feruquímicos']:[];
 return `<section class="panel"><h3>Paso 8. Hoja de personaje</h3>
 <p class="hint">Resumen con todo calculado. Revisa los puntos de colores de arriba: naranja indica que a ese paso le falta algo.</p>
 <div class="sheetgrid"><div><h4>Identidad</h4><dl class="kv"><dt>Personaje</dt><dd>${esc(c.name||'—')}</dd><dt>Jugador</dt><dd>${esc(c.player||'—')}</dd><dt>Ascendencia</dt><dd>${{humano:'Humano',kandra:'Kandra'+(c.blessing?' ('+BLESS[c.blessing].n+')':''),koloss:'Sangre koloss'}[c.ancestry]}</dd><dt>Camino</dt><dd>${p?esc(p.n):'—'}</dd><dt>Era / nivel</dt><dd>${c.era} / ${c.level}</dd></dl></div>
 <div><h4>Atributos</h4><dl class="kv">${ATT.map(([k,n])=>`<dt>${n}</dt><dd>${t[k]}</dd>`).join('')}</dl></div>
 <div><h4>Reservas y defensas</h4><dl class="kv"><dt>Salud</dt><dd>${d.salud}</dd><dt>Concentración</dt><dd>${d.conc}</dd><dt>Investidura</dt><dd>${d.inv===null?'—':'0 / '+d.inv}</dd><dt>Defensa física</dt><dd>${d.fis}</dd><dt>Defensa cognitiva</dt><dd>${d.cog}</dd><dt>Defensa espiritual</dt><dd>${d.esp}</dd><dt>Desvío</dt><dd>${d.desvio}</dd></dl></div>
 <div><h4>Otros valores</h4><dl class="kv"><dt>Levantamiento</dt><dd>${d.lift} kg</dd><dt>Movimiento</dt><dd>${d.move} m</dd><dt>Dado de recuperación</dt><dd>${d.die}</dd><dt>Sentidos</dt><dd>${d.sense}</dd></dl></div>
 <div><h4>Habilidades (atributo, grados, modificador)</h4><table class="sk">${sk}</table></div>
 <div><h4>Pericias</h4><p class="pre">${esc(per.join('\n')||'—')}</p><h4 style="margin-top:12px">Poderes</h4><p class="pre">${esc([...pw,...allp].join('\n')||'—')}</p><h4 style="margin-top:12px">Talentos</h4><p class="pre">${esc([p?p.talent:'',c.ancestry==='humano'?c.talents.ancestry:c.ancestry==='kandra'?'Forma natural, Disfraz kandra':'Resistencia koloss',c.talents.notes].filter(Boolean).join('\n')||'—')}</p></div>
 <div><h4>Equipo</h4><p class="pre">${esc([c.weapons&&'Armas: '+c.weapons,c.armor&&'Armadura: '+c.armor,c.gear,(+c.arquillas)?'Arquillas: '+c.arquillas:''].filter(Boolean).join('\n')||'—')}</p></div>
 <div><h4>Historia</h4><p class="pre">${esc([c.purpose&&'Propósito: '+c.purpose,c.obstacle&&'Obstáculo: '+c.obstacle,...c.goals.filter(Boolean).map(g=>'Meta: '+g),c.connection&&'Conexiones: '+c.connection,c.look&&'Aspecto: '+c.look,c.notes].filter(Boolean).join('\n')||'—')}</p></div></div>
 <div class="row"><button class="btn pri" data-act="copytext">Copiar hoja como texto</button><button class="btn pri" data-act="sheet" data-id="${c.id}">Exportar hoja (PDF)</button><button class="btn" data-act="export">Exportar ficha</button></div></section>`}

/* ---------- texto, exportar, importar ---------- */
function asText(c){const d=derive(c),p=pathInfo(c);
 return [`${c.name||'Personaje'} — ${p?p.n:'sin camino'}, ${c.ancestry}, Era ${c.era}, nivel ${c.level}`,
 ATT.map(([k,n])=>`${n} ${d.t[k]}`).join(' · '),
 `Salud ${d.salud} · Concentración ${d.conc}${d.inv!==null?' · Investidura 0/'+d.inv:''} · Defensas ${d.fis}/${d.cog}/${d.esp} · Desvío ${d.desvio}`,
 `Levantamiento ${d.lift} kg · Movimiento ${d.move} m · Recuperación ${d.die} · Sentidos ${d.sense}`,
 'Habilidades: '+skillList(c).map(s=>`${s[1]} ${sg(mod(c,s[0]))}`).join(', '),
 'Pericias: '+[...c.cultures.filter(Boolean),...c.extra.filter(Boolean)].join(', '),

 x.strokeStyle='#888';x.lineWidth=.5;shRR(x,X+2.2,Y+2.2,W-4.4,H-4.4,Math.max(2,r-2));x.stroke();
 if(label){let f=6.6;x.font='700 '+f+'px '+SHF;while(x.measureText(label.toUpperCase()).width>W-10&&f>4.6){f-=.2;x.font='700 '+f+'px '+SHF}x.fillStyle='#222';x.textAlign='center';x.fillText(label.toUpperCase(),X+W/2,Y+10.5)}x.textAlign='left'}
function shWrap(x,text,w,fs){x.font='500 '+fs+'px '+SHF;const out=[];for(const para of String(text).split('\n')){const words=para.split(/\s+/).filter(Boolean);if(!words.length){out.push('');continue}let line='';for(const wd of words){const t=line?line+' '+wd:wd;if(x.measureText(t).width>w&&line){out.push(line);line=wd}else line=t}out.push(line)}return out}
function shText(x,text,X,Y,W,H,max,min){text=String(text||'').trim();if(!text)return;let fs=max||9;let L;for(;;){L=shWrap(x,text,W,fs);if(L.length*fs*1.22<=H||fs<=(min||6))break;fs-=.5}
 const lh=fs*1.22;const maxL=Math.max(1,Math.floor(H/lh));if(L.length>maxL){L=L.slice(0,maxL);L[maxL-1]=L[maxL-1].replace(/\s*\S{0,3}$/,'')+'…'}
 x.fillStyle='#111';x.font='500 '+fs+'px '+SHF;x.textAlign='left';L.forEach((l,i)=>x.fillText(l,X,Y+fs+i*lh))}

  case 'export':copy(JSON.stringify(c),'Ficha copiada. Pégala en Importar en otro dispositivo');break;
  case 'import':showDlg('Importar ficha','<p class="hint">Pega aquí el texto de una ficha exportada.</p><textarea id="dl-t" rows="8" aria-label="Texto de la ficha"></textarea>');break;
  case 'doimport':{try{const o=JSON.parse($('#dl-t').value);const n=normalize(o);store.chars.push(n);save();$('#dlg').close();render();toast('Ficha importada')}catch(err){toast('El texto no es una ficha válida')}break}
  case 'closedlg':try{$('#dlg').close()}catch(x){$('#dlg').removeAttribute('open')}break;
 }});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.f)return;const c=cur();if(!c)return;
 let v=t.value;if(t.dataset.num)v=Math.max(0,parseInt(v,10)||0);setPath(c,t.dataset.f,v);save();
 if(t.dataset.f==='name'){$('#ttl').textContent=v||'Personaje sin nombre'}
 const s=$('#side');if(s)s.innerHTML=statsPanel(c);
 document.querySelectorAll('.chip .dot').forEach((d,k)=>{d.className='dot '+status(c,k)});
 if(c.mode==='q'){const nb=document.querySelector('[data-act=qnext]');const q=curQ(c);const l=qList(c);if(nb)nb.disabled=!q.v(c)||q===l[l.length-1]}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;if(!t||t.tagName!=='INPUT'||t.type!=='text')return;const c=cur();if(c&&c.mode==='q'&&curQ(c).v(c)){e.preventDefault();qGo(c,1)}});
document.addEventListener('change',e=>{const t=e.target;if(t&&t.id==='avfile'){const f=t.files&&t.files[0];t.value='';const m=$('#avmsg');if(!f)return;if(!/^image\//.test(f.type)){if(m){m.textContent='Elige un archivo de imagen.';m.className='msg err'}return}
 if(m){m.textContent='Procesando…';m.className='msg'}
 avPickImg(f).then(u=>{store.avatar=avOk(u);save();avRefresh(true);const mm=$('#avmsg');if(mm){mm.textContent='Imagen actualizada.';mm.className='msg ok'}const r=document.querySelector('.avrow .row');if(r&&!r.querySelector('[data-act=avdel]'))r.insertAdjacentHTML('beforeend','<button class="btn sm ghost" data-act="avdel">Quitar</button>')}).catch(()=>{const mm=$('#avmsg');if(mm){mm.textContent='No se pudo leer esa imagen.';mm.className='msg err'}});return}
 if(t.tagName==='SELECT'){if(t.dataset&&t.dataset.r)popSel='select[data-f="'+t.dataset.f+'"]';else if(cur()){t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop');metalFx(t)}}if(t.dataset&&t.dataset.r){const c=cur();setPath(c,t.dataset.f,t.value);save();render(1)}});
loadAccounts();render();restoreSession().then(()=>{booting=false;render()});
</script>
